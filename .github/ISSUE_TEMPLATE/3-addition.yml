name: 새 자료 제보
description: 멤버가 직접 말한 먹거리 가운데 사이트에 빠진 것을 알려 주세요.
title: "[제보] "
body:
  - type: markdown
    attributes:
      value: |
        **이 글은 누구나 볼 수 있습니다.**
        멤버 **본인이 직접 말하거나 쓴 것**만 싣습니다. 원문을 볼 수 있는 주소가 꼭 필요합니다.
        "집 근처", "동네 단골"처럼 **사는 곳을 짐작하게 하는 내용은 제보하지 마세요.**
  - type: input
    id: member
    attributes:
      label: 멤버
      placeholder: "예: 시라유키 히나"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 분류
      options:
        - 서브웨이 조합
        - 맛집·카페
        - 단골 메뉴 (프랜차이즈, 편의점, 배달)
        - 좋아하는 음식
        - 못 먹는 음식
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 내용
      description: 멤버가 말한 그대로 적어 주세요. 말하지 않은 부분은 채우지 않아도 됩니다.
      placeholder: "예: 요아정은 기본 요거트에 딸기, 바나나, 그래놀라, 로투스 가루"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 원문 주소
      description: 방송 다시보기, 공식 카페 글, X 글의 주소입니다. 방송은 몇 분 몇 초인지도 적어 주세요.
      placeholder: "https://"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 날짜 (알면)
      placeholder: "예: 2026-11-25"
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: 멤버 본인이 직접 말하거나 쓴 내용이고, 사는 곳을 짐작하게 하는 내용이 아닙니다.
          required: true
